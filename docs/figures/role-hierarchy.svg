<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="920" height="210">
  <title>Role hierarchy: Organizer, Volunteer Admin, Entry Staff (staff roles) and Volunteer, Guest (external)</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <!-- Staff label -->
  <text x="20" y="18" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="1">STAFF ROLES</text>
  <line x1="20" y1="26" x2="560" y2="26" stroke="#d1d5db" stroke-width="1"/>
  <!-- Organizer -->
  <rect x="20" y="40" width="170" height="150" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="105" y="66" text-anchor="middle" fill="#059669" font-size="14" font-weight="700">Organizer</text>
  <text x="105" y="84" text-anchor="middle" fill="#6b7280" font-size="11">Full access</text>
  <line x1="40" y1="96" x2="170" y2="96" stroke="#d1d5db" stroke-width="1"/>
  <text x="36" y="114" fill="#1f2937" font-size="11">Create &amp; manage events</text>
  <text x="36" y="132" fill="#1f2937" font-size="11">Manage members</text>
  <text x="36" y="150" fill="#1f2937" font-size="11">Configure settings</text>
  <text x="36" y="168" fill="#1f2937" font-size="11">Scan &amp; track attendance</text>
  <!-- Volunteer Admin -->
  <rect x="205" y="40" width="170" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="290" y="66" text-anchor="middle" fill="#059669" font-size="14" font-weight="700">Volunteer Admin</text>
  <text x="290" y="84" text-anchor="middle" fill="#6b7280" font-size="11">Attendance + Gear</text>
  <line x1="225" y1="96" x2="355" y2="96" stroke="#d1d5db" stroke-width="1"/>
  <text x="221" y="114" fill="#1f2937" font-size="11">Shift check-in (Attendance)</text>
  <text x="221" y="132" fill="#1f2937" font-size="11">Gear pickup</text>
  <text x="221" y="150" fill="#1f2937" font-size="11">Temporary scanner link</text>
  <!-- Entry Staff -->
  <rect x="390" y="40" width="170" height="150" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="0.75"/>
  <text x="475" y="66" text-anchor="middle" fill="#059669" font-size="14" font-weight="700">Entry Staff</text>
  <text x="475" y="84" text-anchor="middle" fill="#6b7280" font-size="11">Arrival (entrance)</text>
  <line x1="410" y1="96" x2="540" y2="96" stroke="#d1d5db" stroke-width="1"/>
  <text x="406" y="114" fill="#1f2937" font-size="11">QR scan (Event Arrival)</text>
  <text x="406" y="132" fill="#1f2937" font-size="11">Volunteer search</text>
  <text x="406" y="150" fill="#1f2937" font-size="11">Guest list check-in</text>
  <text x="406" y="168" fill="#1f2937" font-size="11">Temporary scanner link</text>
  <!-- Divider -->
  <line x1="580" y1="34" x2="580" y2="190" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- External label -->
  <text x="600" y="18" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="1">EXTERNAL</text>
  <line x1="600" y1="26" x2="900" y2="26" stroke="#d1d5db" stroke-width="1"/>
  <!-- Volunteer -->
  <rect x="600" y="40" width="140" height="150" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="670" y="66" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="700">Volunteer</text>
  <text x="670" y="84" text-anchor="middle" fill="#6b7280" font-size="11">No account needed</text>
  <line x1="620" y1="96" x2="720" y2="96" stroke="#d1d5db" stroke-width="1"/>
  <text x="616" y="114" fill="#1f2937" font-size="11">Sign up for shifts</text>
  <text x="616" y="132" fill="#1f2937" font-size="11">View QR ticket</text>
  <text x="616" y="150" fill="#1f2937" font-size="11">Manage via portal</text>
  <text x="616" y="168" fill="#1f2937" font-size="11">Magic link access</text>
  <!-- Guest -->
  <rect x="755" y="40" width="140" height="150" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="825" y="66" text-anchor="middle" fill="#7c3aed" font-size="14" font-weight="700">Gast</text>
  <text x="825" y="84" text-anchor="middle" fill="#6b7280" font-size="11">No account needed</text>
  <line x1="775" y1="96" x2="875" y2="96" stroke="#d1d5db" stroke-width="1"/>
  <text x="771" y="114" fill="#1f2937" font-size="11">VIPs / Artists / +1</text>
  <text x="771" y="132" fill="#1f2937" font-size="11">QR code via guest list</text>
  <text x="771" y="150" fill="#1f2937" font-size="11">Optional gear</text>
  <text x="771" y="168" fill="#1f2937" font-size="11">No portal access</text>
</svg>
