<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="780" height="220">
  <title>Event lifecycle: Draft to Published Open (with back to Draft), toggleable to Published Closed, then Archived. Clone back to Draft. Public and private events.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>
  <!-- Draft -->
  <rect x="20" y="60" width="130" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="85" y="85" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Draft</text>
  <text x="85" y="103" text-anchor="middle" fill="#6b7280" font-size="10">Setting up</text>
  <!-- Bidirectional arrows Draft ↔ Published Open -->
  <line x1="150" y1="82" x2="178" y2="82" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="178" y1="94" x2="150" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="164" y="74" text-anchor="middle" fill="#059669" font-size="9">Publish</text>
  <text x="164" y="110" text-anchor="middle" fill="#6b7280" font-size="9">Unpublish</text>
  <!-- Published Open -->
  <rect x="188" y="60" width="150" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="263" y="82" text-anchor="middle" fill="#059669" font-size="14" font-weight="600">Published Open</text>
  <text x="263" y="100" text-anchor="middle" fill="#6b7280" font-size="10">Accepting signups</text>
  <!-- Bidirectional arrows Open ↔ Closed -->
  <line x1="338" y1="82" x2="398" y2="82" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="398" y1="94" x2="338" y2="94" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="368" y="74" text-anchor="middle" fill="#f59e0b" font-size="8">Close</text>
  <text x="368" y="110" text-anchor="middle" fill="#f59e0b" font-size="8">Reopen</text>
  <!-- Published Closed -->
  <rect x="408" y="60" width="150" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="483" y="82" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="600">Published Closed</text>
  <text x="483" y="100" text-anchor="middle" fill="#6b7280" font-size="10">Signups closed</text>
  <!-- Arrow Closed → Archived -->
  <line x1="558" y1="88" x2="598" y2="88" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="578" y="80" text-anchor="middle" fill="#059669" font-size="9">Archive</text>
  <!-- Archived -->
  <rect x="608" y="60" width="130" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="673" y="85" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Archived</text>
  <text x="673" y="103" text-anchor="middle" fill="#6b7280" font-size="10">Read-only</text>
  <!-- Clone arrow curving back -->
  <path d="M673,116 C673,170 85,170 85,116" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-gray)"/>
  <text x="380" y="168" text-anchor="middle" fill="#6b7280" font-size="11" font-style="italic">Clone → new Draft</text>
  <!-- Note: public and private -->
  <text x="390" y="200" text-anchor="middle" fill="#6b7280" font-size="11">Publish applies to both <tspan font-weight="600">public</tspan> events (visible on project website) and <tspan font-weight="600">private</tspan> events (direct link only)</text>
</svg>
