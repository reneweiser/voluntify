<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460">
  <title>Scanner workflows: Entry Staff Scanner (Arrival) and Volunteer Admin Scanner (Attendance + Gear)</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="a-yellow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== ENTRY STAFF SCANNER ===== -->
  <rect x="10" y="10" width="760" height="200" rx="10" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="30" y="32" fill="#059669" font-size="13" font-weight="700">Entry Staff Scanner — Event Arrival</text>

  <!-- QR / Search / Guest List -->
  <rect x="30" y="50" width="120" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="90" y="72" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="600">QR / Search</text>
  <text x="90" y="89" text-anchor="middle" fill="#6b7280" font-size="10">+ Guest list</text>
  <!-- Arrow → Validate -->
  <line x1="150" y1="78" x2="178" y2="78" stroke="#059669" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- Validate -->
  <rect x="188" y="50" width="120" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="248" y="72" text-anchor="middle" fill="#059669" font-size="12" font-weight="600">Validate</text>
  <text x="248" y="89" text-anchor="middle" fill="#6b7280" font-size="10">JWT check</text>
  <!-- Branch: Green -->
  <line x1="308" y1="65" x2="388" y2="48" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/>
  <rect x="398" y="20" width="180" height="46" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="488" y="40" text-anchor="middle" fill="#059669" font-size="12" font-weight="600">Valid — Arrival</text>
  <text x="488" y="55" text-anchor="middle" fill="#6b7280" font-size="10">Tap to confirm</text>
  <!-- Branch: Yellow -->
  <line x1="308" y1="78" x2="388" y2="78" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a-yellow)"/>
  <rect x="398" y="60" width="180" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="488" y="80" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">Already arrived</text>
  <text x="488" y="95" text-anchor="middle" fill="#6b7280" font-size="10">Shows first scan time</text>
  <!-- Branch: Red -->
  <line x1="308" y1="92" x2="388" y2="108" stroke="#ef4444" stroke-width="1.5" marker-end="url(#a-red)"/>
  <rect x="398" y="100" width="180" height="46" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="488" y="120" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">No access</text>
  <text x="488" y="135" text-anchor="middle" fill="#6b7280" font-size="10">Shows reason</text>
  <!-- Next button -->
  <rect x="618" y="60" width="130" height="46" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="683" y="80" text-anchor="middle" fill="#1f2937" font-size="11" font-weight="600">Next scan</text>
  <text x="683" y="95" text-anchor="middle" fill="#6b7280" font-size="10">Manual tap</text>
  <line x1="578" y1="83" x2="608" y2="83" stroke="#6b7280" stroke-width="1" marker-end="url(#a-gray)"/>
  <!-- Return arrow -->
  <path d="M683,106 C683,170 90,170 90,106" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>

  <!-- ===== VOLUNTEER ADMIN SCANNER ===== -->
  <rect x="10" y="230" width="760" height="220" rx="10" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="30" y="252" fill="#7c3aed" font-size="13" font-weight="700">Volunteer Admin Scanner — Attendance + Gear</text>

  <!-- QR / Search -->
  <rect x="30" y="270" width="120" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="90" y="292" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="600">QR / Search</text>
  <text x="90" y="309" text-anchor="middle" fill="#6b7280" font-size="10">Find volunteer</text>
  <!-- Arrow → Volunteer View -->
  <line x1="150" y1="298" x2="178" y2="298" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <!-- Volunteer View -->
  <rect x="188" y="270" width="140" height="56" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="258" y="289" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">Volunteer Info</text>
  <text x="258" y="306" text-anchor="middle" fill="#6b7280" font-size="10">Name, phone, shifts, gear</text>
  <!-- Branch: Check-in mode -->
  <line x1="328" y1="286" x2="388" y2="276" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="398" y="256" width="200" height="46" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="498" y="276" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">Per-Shift Attendance</text>
  <text x="498" y="291" text-anchor="middle" fill="#6b7280" font-size="10">Configurable states per project</text>
  <!-- Branch: Gear mode -->
  <line x1="328" y1="310" x2="388" y2="320" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="398" y="310" width="200" height="46" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="498" y="330" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">Gear Pickup</text>
  <text x="498" y="345" text-anchor="middle" fill="#6b7280" font-size="10">Typ 1 (size) + Typ 2 (quantity)</text>
  <!-- Next button -->
  <rect x="638" y="280" width="110" height="46" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="693" y="300" text-anchor="middle" fill="#1f2937" font-size="11" font-weight="600">Next scan</text>
  <text x="693" y="315" text-anchor="middle" fill="#6b7280" font-size="10">Manual tap</text>
  <line x1="598" y1="303" x2="628" y2="303" stroke="#6b7280" stroke-width="1" marker-end="url(#a-gray)"/>
  <!-- Return arrow -->
  <path d="M693,326 C693,400 90,400 90,326" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>

  <!-- Mode note -->
  <text x="398" y="375" fill="#6b7280" font-size="10" font-style="italic">Modes configurable: check-in only, gear pickup only, or both</text>
  <text x="398" y="390" fill="#6b7280" font-size="10" font-style="italic">Gear-only mode: no shift information shown</text>

  <!-- Legend -->
  <text x="30" y="440" fill="#6b7280" font-size="10">
    <tspan fill="#059669" font-weight="600">Entry Staff</tspan> = Event Arrival (entrance)  |
    <tspan fill="#7c3aed" font-weight="600">Volunteer Admin</tspan> = Shift Attendance + Gear (on-site management)
  </text>
</svg>
