<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="860" height="180">
  <title>Volunteer journey: email verification first, then shifts, gear/fields, confirm, receive ticket</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>
  <!-- Phase labels -->
  <rect x="20" y="10" width="270" height="22" rx="4" fill="#fef3c7"/>
  <text x="155" y="25" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">STEP 1 — EMAIL + VERIFICATION</text>
  <rect x="310" y="10" width="300" height="22" rx="4" fill="#d1fae5"/>
  <text x="460" y="25" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">STEP 2-3 — SHIFTS + GEAR/FIELDS</text>
  <rect x="630" y="10" width="210" height="22" rx="4" fill="#d1fae5"/>
  <text x="735" y="25" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">STEP 4 — CONFIRM</text>
  <!-- Step 1: Email -->
  <rect x="20" y="50" width="110" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="75" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="600">E-Mail</text>
  <text x="75" y="92" text-anchor="middle" fill="#6b7280" font-size="10">+ DB check</text>
  <!-- Arrow -->
  <line x1="130" y1="78" x2="148" y2="78" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step 2: Verify -->
  <rect x="158" y="50" width="110" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="213" y="75" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="600">Verify</text>
  <text x="213" y="92" text-anchor="middle" fill="#6b7280" font-size="10">Link per E-Mail</text>
  <!-- Arrow -->
  <line x1="268" y1="78" x2="298" y2="78" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step 3: Shifts -->
  <rect x="308" y="50" width="120" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="368" y="75" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="600">Shifts</text>
  <text x="368" y="92" text-anchor="middle" fill="#6b7280" font-size="10">20-min timer</text>
  <!-- Arrow -->
  <line x1="428" y1="78" x2="458" y2="78" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step 4: Gear + Fields -->
  <rect x="468" y="50" width="120" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="528" y="75" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="600">Gear + Fields</text>
  <text x="528" y="92" text-anchor="middle" fill="#6b7280" font-size="10">if applicable</text>
  <!-- Arrow -->
  <line x1="588" y1="78" x2="618" y2="78" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step 5: Confirm -->
  <rect x="628" y="50" width="120" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="688" y="70" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">Verbindlich</text>
  <text x="688" y="87" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">anmelden</text>
  <!-- Arrow -->
  <line x1="748" y1="78" x2="778" y2="78" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step 6: QR Ticket -->
  <rect x="788" y="50" width="56" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="816" y="75" text-anchor="middle" fill="#059669" font-size="12" font-weight="700">QR</text>
  <text x="816" y="92" text-anchor="middle" fill="#059669" font-size="10">Ticket</text>
  <!-- Bottom caption -->
  <text x="430" y="140" text-anchor="middle" fill="#6b7280" font-size="11">E-Mail verification first — no shifts reserved until identity confirmed</text>
  <text x="430" y="158" text-anchor="middle" fill="#6b7280" font-size="11">Returning volunteers: existing shifts/gear read-only, only new shifts selectable</text>
</svg>
