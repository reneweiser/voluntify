<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290">
  <title>Comparison of event arrival (entrance scanning) versus shift attendance (per-shift tracking with configurable states)</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <!-- Left card: Event Arrival -->
  <rect x="20" y="16" width="310" height="180" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="175" y="44" text-anchor="middle" fill="#059669" font-size="15" font-weight="700">Event Arrival</text>
  <line x1="40" y1="56" x2="310" y2="56" stroke="#059669" stroke-width="0.5" opacity="0.4"/>
  <text x="40" y="80" fill="#1f2937" font-size="12"><tspan font-weight="600" fill="#6b7280">When:</tspan> At the entrance</text>
  <text x="40" y="100" fill="#1f2937" font-size="12"><tspan font-weight="600" fill="#6b7280">Who:</tspan> Entry Staff Scanner</text>
  <text x="40" y="120" fill="#1f2937" font-size="12"><tspan font-weight="600" fill="#6b7280">How:</tspan> QR scan, search, guest list</text>
  <text x="40" y="140" fill="#1f2937" font-size="12"><tspan font-weight="600" fill="#6b7280">Result:</tspan> Arrived / Not arrived</text>
  <text x="40" y="162" fill="#6b7280" font-size="11" font-style="italic">Per volunteer per event — multiple arrivals</text>
  <text x="40" y="180" fill="#6b7280" font-size="11" font-style="italic">possible across different events</text>
  <!-- VS divider -->
  <text x="350" y="114" text-anchor="middle" fill="#d1d5db" font-size="18" font-weight="700">vs</text>
  <!-- Right card: Shift Attendance -->
  <rect x="380" y="16" width="300" height="180" rx="8" fill="#f0f4f8" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="530" y="44" text-anchor="middle" fill="#475569" font-size="15" font-weight="700">Shift Attendance</text>
  <line x1="400" y1="56" x2="660" y2="56" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
  <text x="400" y="80" fill="#1f2937" font-size="12"><tspan font-weight="600" fill="#6b7280">When:</tspan> At shift start</text>
  <text x="400" y="100" fill="#1f2937" font-size="12"><tspan font-weight="600" fill="#6b7280">Who:</tspan> Volunteer Admin / Organizer</text>
  <text x="400" y="120" fill="#1f2937" font-size="12"><tspan font-weight="600" fill="#6b7280">How:</tspan> Per-shift status toggle</text>
  <text x="400" y="140" fill="#1f2937" font-size="12"><tspan font-weight="600" fill="#6b7280">Result:</tspan> Configurable states</text>
  <text x="400" y="162" fill="#6b7280" font-size="11" font-style="italic">Per volunteer per shift — states defined</text>
  <text x="400" y="180" fill="#6b7280" font-size="11" font-style="italic">in project settings with default status</text>
  <!-- Conflict callout -->
  <rect x="20" y="216" width="660" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="350" y="240" text-anchor="middle" fill="#1f2937" font-size="12">
    <tspan font-weight="600" fill="#f59e0b">Conflict indicator:</tspan> Highlights when a volunteer arrived at the event but has default status for a shift
  </text>
  <text x="350" y="260" text-anchor="middle" fill="#6b7280" font-size="11">Example: Volunteer arrived at 13:00 but still shows default status for 14:00 shift</text>
</svg>
