# Voluntify — Docker Compose for multi-service VPS with shared Caddy reverse proxy
#
# Prerequisites:
#   - A shared Caddy container already running on the VPS, attached to the "caddy" Docker network
#   - A DNS A record pointing your domain to the VPS IP
#   - A .env file configured for production (see docs/deployment.md)
#
# Add this block to your shared Caddyfile, then reload Caddy:
#
#   voluntify.example.com {
#       reverse_proxy voluntify-app:80
#   }
#
# Usage:
#   Set IMAGE_TAG to the commit SHA of a published build containing the patched Dockerfile.
#   Back up MariaDB before upgrading an existing database to the pinned release.
#   docker compose -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/reneweiser/voluntify:${IMAGE_TAG:?Set IMAGE_TAG to the commit SHA of a published patched build}
    # To build from source instead of pulling from GHCR, comment out "image" above and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: voluntify-app
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - app-storage:/app/storage/app
    networks:
      - caddy
      - voluntify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: ghcr.io/reneweiser/voluntify:${IMAGE_TAG:?Set IMAGE_TAG to the commit SHA of a published patched build}
    restart: unless-stopped
    entrypoint: ["php"]
    command: ["artisan", "schedule:work"]
    healthcheck:
      disable: true
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - app-storage:/app/storage/app
    networks:
      - voluntify
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  queue:
    image: ghcr.io/reneweiser/voluntify:${IMAGE_TAG:?Set IMAGE_TAG to the commit SHA of a published patched build}
    restart: unless-stopped
    entrypoint: ["php"]
    command: ["artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - app-storage:/app/storage/app
    networks:
      - voluntify
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-voluntify}"
      MARIADB_USER: "${DB_USERNAME:-voluntify}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - voluntify
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy:
    external: true
  voluntify:
    driver: bridge

volumes:
  app-storage:
  mariadb-data:
